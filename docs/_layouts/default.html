<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <input type="checkbox" id="nav-toggle" class="nav-toggle">

  <div class="page">
    {% include sidebar.html %}
    <main class="content">
      <div class="content-header">
        <label for="nav-toggle" class="menu-button">&#9776; Contents</label>
      </div>
      <article class="page-body">
        {% if page.title and page.url != '/wiki/' %}
          <h1 class="page-title">{{ page.title }}</h1>
        {% endif %}
        {{ content }}
      </article>
      <footer class="page-footer">
        Original author: Gene Selkov Jr &middot;
        Wiki recovered by Charlotte Dawson &middot;
        <a href="https://github.com/csdaw/unfinnigan">source</a>
        {% if page.original %}
          &middot;
          <a href="{{ page.original }}">original page</a>
        {% endif %}
      </footer>
    </main>
  </div>
</body>
</html>
